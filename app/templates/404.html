<!-- app/templates/404.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px 30px;
        }
        .container {
            padding: 20px 40px;
            text-align: center;
        }
        h1 {
            color: #ecf0f1;
        }
        p {
            color: #bdc3c7;
        }
        a {
            background: #3498db;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        a:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <h1>404 - Page Not Found</h1>
    </header>
    <div class="container">
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/">Return to home page</a>
    </div>
</body>
</html>
